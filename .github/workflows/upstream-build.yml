name: S25 Ultra Keyboard APK

on:
  push:
    branches: [dev/samsung-s25-ultra]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: '0.2.0'
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout S25 layout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout FUTO source
        uses: actions/checkout@v4
        with:
          repository: futo-org/android-keyboard
          ref: 7d61ab4132cfcbb7aa713190d934f0125dc38b03
          path: futo
          submodules: recursive
          persist-credentials: false

      - name: Apply S25 layout
        run: bash scripts/apply-layout.sh futo

      - name: Fetch offline swipe models
        working-directory: futo/java/assets/futo-swipe
        run: |
          git lfs install --local --skip-repo
          git lfs pull

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Compile APK
        working-directory: futo
        run: ./gradlew assembleUnstableDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(futo/build/outputs/apk/unstable/debug/*.apk)
          test "${#apks[@]}" -eq 1
          bash scripts/verify-apk.sh "${apks[0]}"
          cp "${apks[0]}" S25-Keyboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S25-Keyboard-APK
          path: S25-Keyboard.apk
          if-no-files-found: error
          retention-days: 7
